<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viva Imóveis</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
background:#1f4d46;
}

/* HEADER */

header{
background:#f2f2f2;
height:90px;
display:flex;
align-items:center;
padding-left:40px;
}

.logo{
font-size:24px;
font-weight:bold;
color:#333;
}

/* HERO */

.hero{
height:600px;
background:url("imagens/fundoCidade.jpg") center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
position:relative;
}

/* SEARCH BAR */

.search-box{
background:white;
width:500px;
height:50px;
border-radius:40px;
display:flex;
align-items:center;
padding:0 20px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.search-box input{
border:none;
outline:none;
flex:1;
font-size:16px;
}

.search-icon{
font-size:18px;
color:#666;
}

/* CARD */

.info-card{
position:absolute;
bottom:-60px;
left:80px;
background:#eee;
width:260px;
padding:25px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.info-card h3{
margin-bottom:10px;
font-size:16px;
}

.info-card p{
font-size:13px;
color:#555;
line-height:1.5;
}

/* SECTION */

.section{
height:400px;
background:#1f4d46;
}

footer{
background:#ffffff;
padding:25px;
text-align:center;
font-size:14px;
color:#555;
border-top:1px solid #ddd;
}

footer .links{
margin-top:10px;
}

footer .links a{
margin:0 10px;
text-decoration:none;
color:#333;
font-weight:500;
}

footer .links a:hover{
color:#1f4d46;
}

</style>

</head>
<body>

<header>
<div class="logo">
<img src="imagens/logo.jpeg" alt="Viva Imóveis">
</div>
</header>

<section class="hero">

<div class="search-box">
<input type="text" placeholder="Pesquisar:">
<div class="search-icon">🔍</div>
</div>

<div class="info-card">
<h3>Os melhores imóveis</h3>
<p>
Escolha entre apartamentos, casas, salas,<br>
e considere uma visita com nossa equipe
de atendimento.
</p>
</div>

</section>

<section class="section"></section>

<footer>

<p>© 2026 Viva Imóveis - Todos os direitos reservados</p>

<div class="links">
<a href="#">Início</a>
<a href="#">Imóveis</a>
<a href="#">Contato</a>
<a href="#">Sobre</a>
</div>

</footer>

</body>
</html>
